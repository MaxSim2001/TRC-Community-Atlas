name: Atlas tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    name: Windows / Node.js 24
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate JavaScript
        run: npm run check

      - name: Run Atlas test suite
        run: npm test
